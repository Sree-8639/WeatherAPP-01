services:
  - type: web
    name: weather-app
    env: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: RENDER_SERVICE_INSTANCE_ID
        fromService:
          type: web
          name: weather-app
          property: id
